<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragan Bjelica — Backend Developer</title>
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #12161b;
      --line: #22282f;
      --text: #e6e9ec;
      --muted: #7c8794;
      --accent: #5ee6a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .panel {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 32px 28px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 230, 168, 0.15);
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .role {
      margin: 0 0 22px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .log {
      border-top: 1px dashed var(--line);
      padding-top: 18px;
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .log span.ok { color: var(--accent); }

    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    a:hover { border-bottom-color: var(--accent); }
  </style>
</head>
<body>
<div class="panel">
  <div class="status-row">
    <span class="dot"></span>
    <span>system status: building</span>
  </div>

  <h1>Dragan Bjelica</h1>
  <p class="role">Backend developer — designing systems built to scale</p>

  <div class="log">
    <div><span class="ok">[deployed]</span> empty scaffold live on this URL</div>
    <div>[next] case study — monolith → modular services</div>
    <div>[contact] <a href="mailto:you@example.com">draganbjelica12@gmail.com</a> · <a href="https://github.com/draganb24" target="_blank" rel="noopener">github</a></div>
  </div>
</div>
</body>
</html>
